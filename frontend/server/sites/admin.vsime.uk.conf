server {
    listen 80;
    server_name admin.vsime.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.vsime.uk;

    # Use your certs (Let's Encrypt or Cloudflare Origin cert)
    ssl_certificate /etc/letsencrypt/live/admin.vsime.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.vsime.uk/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/vsim-pwa/frontend; # path to this repo's frontend folder on your VPS
    index admin.html;

    # Serve the SPA, fallback to admin.html for deep links
    location / {
        try_files $uri $uri/ /admin.html;
    }

    # Proxy API requests to local API server
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Optional: serve websockets for realtime if needed
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Security headers (inherit from main config as needed)
}
